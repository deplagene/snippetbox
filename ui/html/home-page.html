{{template "base" .}}

{{define "title"}}Домашняя страница{{end}}

{{define "main"}}
<h2>Последние заметки</h2>
{{if .Snippets}}
    <table>
        <tr>
            <th>Заголовок</th>
            <th>Создан</th>
            <th>ID</th>
        </tr>
        {{range .Snippets}}
            <tr>
                <td><a href='/snippet?id={{.SnippetID}}'>{{.Title}}</a></td>
                <td>{{humanDate .Created}}</td>
                <td>{{.SnippetID}}</td>
            </tr>
        {{end}}
    </table>
    {{else}}
        <p> Здесь пока что пусто! </p>
    {{end}}
{{end}}
