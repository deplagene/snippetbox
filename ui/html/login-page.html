{{template "base" .}}

{{define "title"}}Login{{end}}

{{define "main"}}
    <form action='/user/login' method='POST' novalidate>
        <div class='form-group'>
            <label>Почта:</label>
            <input type='email' name='email' value='{{.Form.Email}}'>
        </div>
        <div class='form-group'>
            <label>Пароль:</label>
            <input type='password' name='password'>
        </div>
        <div class='form-group'>
            <input type='submit' value='Войти'>
        </div>
    </form>
{{end}}
