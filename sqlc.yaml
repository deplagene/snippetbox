version: '2'
sql:
  - engine: 'postgresql'
    queries: 'sql/queries'
    schema: 'sql/schema'
    gen:
      go:
        package: 'database'
        out: 'internal/database'
        sql_package: 'pgx/v5'
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
